<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : on utilise tout l'écran, y compris autour de la caméra du téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Couleur de la barre du haut d'Android (heure, batterie) -->
  <meta name="theme-color" content="#0f0f14">
  <!-- Le "manifeste" : permet "Ajouter à l'écran d'accueil" sur Android (Samsung Internet, Chrome),
       avec une icône et une ouverture en plein écran, comme une vraie appli -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone-192.png">
  <title>Révision Immo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ÉCRAN 1 et 2 : les menus (accueil = matières, puis la liste des chapitres).
       app.js remplit cette zone. -->
  <div class="menu" id="menu">
    <p class="chargement">Chargement…</p>
  </div>

  <!-- ÉCRAN 3 : le fil TikTok d'un chapitre (caché tant qu'on n'a pas choisi) -->
  <header class="entete" id="entete" hidden>
    <div class="barre-fil">
      <!-- ✕ = fermer le chapitre et revenir à la liste -->
      <button class="bouton-rond" id="bouton-fermer" aria-label="Fermer le chapitre">✕</button>
      <div class="titre-fil" id="titre-fil"></div>
      <!-- Son des vidéos : 🔊 / 🔇 -->
      <button class="bouton-rond" id="bouton-son">🔊</button>
    </div>
    <!-- Petit compteur : "3 / 9" -->
    <div class="compteur" id="compteur">…</div>
  </header>

  <!-- Le fil vertical : app.js va y ajouter une <section> par carte -->
  <main class="fil" id="fil" hidden></main>

  <!-- video.js d'abord : app.js utilise ses fonctions -->
  <script src="suivi.js"></script>
  <script src="video.js"></script>
  <script src="examen.js"></script>
  <script src="app.js"></script>
</body>
</html>
