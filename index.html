<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover : on utilise tout l'écran, y compris autour de la caméra du téléphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Couleur de la barre du haut d'Android (heure, batterie) -->
  <meta name="theme-color" content="#0f0f14">
  <!-- Le "manifeste" : permet "Ajouter à l'écran d'accueil" sur Android (Samsung Internet, Chrome),
       avec une icône et une ouverture en plein écran, comme une vraie appli -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icone-192.png">
  <title>Révision Immo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barre fixe en haut : les filtres par matière + le compteur -->
  <header class="entete">
    <!-- app.js crée ici un bouton par matière ("Tout", "Juridique"…) -->
    <nav class="filtres" id="filtres" aria-label="Filtrer par matière"></nav>
    <div class="outils">
      <!-- Petit compteur : "3 / 10" -->
      <div class="compteur" id="compteur">…</div>
      <!-- Bouton pour mélanger les cartes (on / off) -->
      <button class="bouton-melanger" id="bouton-melanger" aria-pressed="false">🔀 Mélanger</button>
      <!-- Son des vidéos : 🔊 / 🔇 -->
      <button class="bouton-melanger" id="bouton-son">🔊</button>
    </div>
  </header>

  <!-- Le fil vertical : app.js va y ajouter une <section> par carte -->
  <main class="fil" id="fil">
    <p class="chargement">Chargement des cartes…</p>
  </main>

  <!-- video.js d'abord : app.js utilise ses fonctions -->
  <script src="video.js"></script>
  <script src="app.js"></script>
</body>
</html>
